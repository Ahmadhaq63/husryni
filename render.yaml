# Render Blueprint: a free TEST deployment of Húsrýni (https://render.com/docs/blueprint-spec).
#
# The free plan has no permanent disk, so inspections and photos are wiped whenever the service
# restarts, redeploys or sleeps (after 15 minutes without visitors). Fine for trying the app out.
# For real use: set `plan: starter`, add `disk: { name: data, mountPath: /var/data, sizeGB: 1 }`
# and the env var DATA_DIR=/var/data.
services:
  - type: web
    name: husryni
    runtime: node
    plan: free
    region: frankfurt
    # Address suggestions need the official register from HMS; deploy without them if HMS is unreachable.
    buildCommand: 'npm ci && (npm run addresses || echo "Address suggestions skipped") && npm run build'
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false # Render asks for it when you create the service
      - key: INSPECTOR_PASSCODE
        sync: false # the passcode your team uses for /inspector
      - key: SESSION_SECRET
        generateValue: true # Render makes a random one
